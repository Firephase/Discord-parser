<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Barbie Dress-Up Game</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#ff9de2,#ffb3de 40%,#c9b8ff 70%,#a8d8ff);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-bottom:20px}
h1{color:#fff;text-shadow:0 2px 12px #c060a0;font-size:2rem;margin:14px 0 10px;letter-spacing:3px}
.main{display:flex;gap:14px;align-items:flex-start;width:100%;max-width:920px;padding:0 10px}
.stage{flex-shrink:0;width:270px;background:linear-gradient(180deg,#fff5fd,#fce4f5 70%,#f0d0f0);border-radius:24px;border:3px solid #f090c8;box-shadow:0 8px 32px #e080c040;padding:14px 14px 60px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.stage::after{content:'';position:absolute;bottom:0;left:0;right:0;height:65px;background:linear-gradient(180deg,#f0c0e8,#e0a8d8);border-radius:0 0 21px 21px}
.barbie-wrap{position:relative;z-index:1;width:190px;height:490px}
.controls{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel{background:rgba(255,255,255,.86);border-radius:16px;border:2px solid #f8c0e0;box-shadow:0 4px 16px #e070b018;padding:12px}
.ptitle{font-size:.76rem;font-weight:700;color:#c060a0;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:9px;text-align:center}
.skin-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .16s,border-color .16s;box-shadow:0 2px 6px #0003}
.sw:hover{transform:scale(1.2)}
.sw.active{border-color:#c060a0;box-shadow:0 0 0 2px #fff,0 0 0 4px #c060a0}
.tabs{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:9px}
.tab{padding:5px 9px;border:2px solid #e090c8;background:#fff0f8;border-radius:20px;cursor:pointer;font-size:.7rem;font-weight:700;color:#a050a0;transition:all .16s}
.tab:hover,.tab.active{background:#f060b0;color:#fff;border-color:#f060b0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.card{background:#fff8fd;border:2px solid #f0c0e0;border-radius:12px;padding:7px 4px;cursor:pointer;text-align:center;transition:all .16s;display:flex;flex-direction:column;align-items:center;gap:2px}
.card:hover{border-color:#f060b0;background:#fde8f8;transform:translateY(-2px)}
.card.active{border-color:#f060b0;background:#ffd6f0;box-shadow:0 0 0 2px #f060b040}
.card .ic{font-size:1.5rem;line-height:1}
.card .lb{font-size:.56rem;color:#904070;line-height:1.3}
.actions{display:flex;gap:8px;justify-content:center}
.btn{padding:10px 22px;border:none;border-radius:22px;cursor:pointer;font-size:.88rem;font-weight:700;transition:all .16s;box-shadow:0 4px 12px #0002}
.btn-r{background:#ff8fc8;color:#fff}.btn-r:hover{background:#e060a0;transform:translateY(-1px)}
.btn-s{background:#a060f0;color:#fff}.btn-s:hover{background:#8040d0;transform:translateY(-1px)}
.L{display:none}.L.on{display:block}
@media(max-width:640px){.main{flex-direction:column;align-items:center}.stage{width:220px}.barbie-wrap{width:160px;height:410px}.controls{width:100%;max-width:400px}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

  jewelry:[{id:'jw-pearl',ic:'📿',lb:'Pearl Necklace'},{id:'jw-gold',ic:'✨',lb:'Gold Pendant'},{id:'jw-studs',ic:'💠',lb:'Diamond Studs'},{id:'jw-chandelier',ic:'💎',lb:'Chandelier Earrings'},{id:'jw-bangles',ic:'💛',lb:'Bangles'},{id:'jw-tiara',ic:'👸',lb:'Tiara'}],
  makeup:[{id:'mk-shadow-pink',ic:'🩷',lb:'Pink Shadow'},{id:'mk-shadow-smoky',ic:'🌑',lb:'Smoky Eye'},{id:'mk-eyeliner',ic:'✏️',lb:'Bold Eyeliner'},{id:'mk-lips-red',ic:'💋',lb:'Red Lips'},{id:'mk-lips-pink',ic:'🌸',lb:'Pink Lips'},{id:'mk-blush',ic:'🌷',lb:'Blush'},{id:'mk-highlight',ic:'🌟',lb:'Highlighter'}],
  shoes:[{id:'sh-stiletto',ic:'👠',lb:'Pink Stilettos'},{id:'sh-boots',ic:'👢',lb:'Knee-High Boots'},{id:'ac-dupatta',ic:'🧕',lb:'Dupatta Head'},{id:'ac-sunglasses',ic:'🕶️',lb:'Sunglasses'},{id:'ac-kokoshnik',ic:'🎭',lb:'Kokoshnik'}]
};

const st={skin:'s1',cat:'dress',sub:'pk',dress:null,hair:null,multi:new Set()};

document.querySelectorAll('[data-s]').forEach(e=>e.addEventListener('click',()=>setSkin(e.dataset.s)));
document.querySelectorAll('[data-cat]').forEach(e=>e.addEventListener('click',()=>setCat(e.dataset.cat)));
document.querySelectorAll('[data-sub]').forEach(e=>e.addEventListener('click',()=>setSub(e.dataset.sub)));

setSkin('s1'); renderGrid();

function setSkin(k){
  const t=SKINS[k]; const sv=document.getElementById('sv');
  sv.style.setProperty('--sc',t.c); sv.style.setProperty('--sh',t.h); sv.style.setProperty('--sdc',t.d);
  st.skin=k;
  document.querySelectorAll('[data-s]').forEach(e=>e.classList.toggle('active',e.dataset.s===k));
}

function setCat(c){
  st.cat=c;
  document.querySelectorAll('[data-cat]').forEach(e=>e.classList.toggle('active',e.dataset.cat===c));
  document.getElementById('sub-tabs').style.display=c==='dress'?'flex':'none';
  renderGrid();
}

function setSub(s){
  st.sub=s;
  document.querySelectorAll('[data-sub]').forEach(e=>e.classList.toggle('active',e.dataset.sub===s));
  renderGrid();
}

function renderGrid(){
  const g=document.getElementById('grid'); g.innerHTML='';
  const items=st.cat==='dress'?DATA.dress[st.sub]:DATA[st.cat];
  items.forEach(item=>{
    const btn=document.createElement('button'); btn.className='card'; btn.dataset.id=item.id;
    const isOn=st.cat==='dress'?st.dress===item.id:st.cat==='hair'?st.hair===item.id:st.multi.has(item.id);
    if(isOn)btn.classList.add('active');
    btn.innerHTML=`<span class="ic">${item.ic}</span><span class="lb">${item.lb}</span>`;
    btn.addEventListener('click',()=>pick(item.id,btn));
    g.appendChild(btn);
  });
}

function pick(id,btn){
  if(st.cat==='dress'){
    if(st.dress){show(st.dress,false);}
    if(st.dress===id){st.dress=null;}
    else{st.dress=id;show(id,true);}
    renderGrid();
  } else if(st.cat==='hair'){
    if(st.hair)show(st.hair,false);
    if(st.hair===id){st.hair=null;}
    else{st.hair=id;show(id,true);}
    renderGrid();
  } else {
    // shoes: only one shoe at a time
    if(id==='sh-stiletto'||id==='sh-boots'){
      const other=id==='sh-stiletto'?'sh-boots':'sh-stiletto';
      if(st.multi.has(other)){st.multi.delete(other);show(other,false);}
    }
    if(st.multi.has(id)){st.multi.delete(id);show(id,false);}
    else{st.multi.add(id);show(id,true);}
    renderGrid();
  }
}

function show(id,on){const el=document.getElementById(id);if(el)el.classList.toggle('on',on);}

function resetAll(){
  document.querySelectorAll('.L').forEach(e=>e.classList.remove('on'));
  st.dress=null;st.hair=null;st.multi.clear();
  setSkin('s1');renderGrid();
}

function saveSVG(){
  const sv=document.getElementById('sv');
  // Resolve actual skin color values
  const sc=sv.style.getPropertyValue('--sc')||'#FDDBB4';
  const sh=sv.style.getPropertyValue('--sh')||'#FEEECE';
  const sdc=sv.style.getPropertyValue('--sdc')||'#c89060';
  // Serialize and replace CSS variables with real values
  let xml=new XMLSerializer().serializeToString(sv);
  xml=xml.replace(/var\(--sc,[^)]*\)/g,sc).replace(/var\(--sc\)/g,sc);
  xml=xml.replace(/var\(--sh,[^)]*\)/g,sh).replace(/var\(--sh\)/g,sh);
  xml=xml.replace(/var\(--sdc,[^)]*\)/g,sdc).replace(/var\(--sdc\)/g,sdc);
  // Parse, remove hidden layers, strip helper classes
  const doc=new DOMParser().parseFromString(xml,'image/svg+xml');
  doc.querySelectorAll('.L').forEach(el=>{
    if(!el.classList.contains('on')) el.remove();
    else { el.removeAttribute('class'); }
  });
  const finalXml=new XMLSerializer().serializeToString(doc.documentElement);
  const blob=new Blob([finalXml],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='barbie-outfit.svg';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
</script>
