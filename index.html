<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbie Dress-Up Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff9de2 0%, #ffb3de 30%, #c9b8ff 70%, #a8d8ff 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    color: #fff;
    text-shadow: 0 2px 8px #c060a0;
    font-size: 2.2rem;
    margin: 18px 0 8px;
    letter-spacing: 2px;
  }

  .game-area {
    display: flex;
    gap: 18px;
    padding: 10px;
    width: 100%;
    max-width: 1200px;
    justify-content: center;
  }

  /* ── LEFT PANEL ── */
  .left-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 200px;
    flex-shrink: 0;
  }

  /* ── BARBIE STAGE ── */
  .stage {
    background: linear-gradient(180deg, #ffe0f7 0%, #ffd6f0 60%, #e8c8f8 100%);
    border-radius: 20px;
    border: 3px solid #f090c8;
    box-shadow: 0 8px 32px #e080c040;
    width: 320px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 10px;
  }

  .stage-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 30% at 50% 100%, #f8b4e0 0%, transparent 70%),
      linear-gradient(180deg, #fff5fd 0%, #fce4f5 100%);
    z-index: 0;
  }

  .stage-floor {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: linear-gradient(180deg, #f0c0e8 0%, #e8a8d8 100%);
    border-radius: 0 0 17px 17px;
    z-index: 1;
  }

  .barbie-container {
    position: relative;
    z-index: 2;
    margin-top: 10px;
    width: 180px;
    height: 460px;
  }

  /* ── RIGHT PANEL ── */
  .right-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 200px;
    flex-shrink: 0;
  }

  /* ── CATEGORY TABS ── */
  .panel-card {
    background: rgba(255,255,255,0.82);
    border-radius: 14px;
    border: 2px solid #f8c0e0;
    box-shadow: 0 4px 16px #e070b020;
    padding: 10px;
  }

  .panel-card h3 {
    font-size: 0.82rem;
    color: #c060a0;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-align: center;
  }

  .skin-swatches {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .skin-swatch {
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    transition: transform .2s, border-color .2s;
  }
  .skin-swatch:hover { transform: scale(1.15); }
  .skin-swatch.active { border-color: #c060a0; }

  .category-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
    margin-bottom: 6px;
  }

  .cat-btn {
    padding: 4px 8px;
    border: 2px solid #e090c8;
    background: #fff0f8;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.72rem;
    color: #a050a0;
    transition: all .2s;
  }
  .cat-btn:hover, .cat-btn.active {
    background: #f060b0;
    color: #fff;
    border-color: #f060b0;
  }

  .item-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    max-height: 300px;
    overflow-y: auto;
    padding-right: 2px;
  }

  .item-grid::-webkit-scrollbar { width: 4px; }
  .item-grid::-webkit-scrollbar-thumb { background: #f090c8; border-radius: 4px; }

  .item-btn {
    background: #fff8fd;
    border: 2px solid #f0c0e0;
    border-radius: 10px;
    padding: 6px 4px;
    cursor: pointer;
    text-align: center;
    font-size: 0.65rem;
    color: #904070;
    transition: all .2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .item-btn:hover { border-color: #f060b0; background: #fde8f8; transform: translateY(-2px); }
  .item-btn.active { border-color: #f060b0; background: #ffd6f0; }
  .item-btn .icon { font-size: 1.5rem; }
  .item-btn .label { font-size: 0.58rem; line-height: 1.2; }

  .action-btns {
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-reset, .btn-save {
    padding: 8px 18px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: bold;
    transition: all .2s;
  }
  .btn-reset { background: #ff8fc8; color: #fff; }
  .btn-reset:hover { background: #e060a0; }
  .btn-save { background: #a060f0; color: #fff; }
  .btn-save:hover { background: #8040d0; }

  /* ── SVG BARBIE ── */
  svg.barbie { width: 100%; height: 100%; }

  /* Clothing layer visibility */
  .cloth-layer { display: none; }
  .cloth-layer.visible { display: block; }
</style>
</head>

    </div>

    <div class="panel-card">

let state = {

// ─── RENDER GRIDS ────────────────────────────────────────────────────────────

function renderGrid(containerId, items, type, multiSelect = false) {
  const grid = document.getElementById(containerId);
  grid.innerHTML = '';
  items.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'item-btn';
    btn.dataset.id = item.id;
    btn.dataset.type = type;
    btn.innerHTML = `<span class="icon">${item.icon}</span><span class="label">${item.label}</span>`;
    btn.addEventListener('click', () => toggleItem(btn, type, item.id, multiSelect));
    grid.appendChild(btn);
  });
}

function renderDressGrid() {
  renderGrid('dress-grid', DRESSES[state.dressCat], 'dress', false);
  // Re-highlight active dress if still applicable
  highlightActive('dress-grid', state.dress ? [state.dress] : []);
}

function highlightActive(gridId, activeIds) {
  document.querySelectorAll(`#${gridId} .item-btn`).forEach(btn => {
    btn.classList.toggle('active', activeIds.includes(btn.dataset.id));
  });
}

// ─── TOGGLE LOGIC ─────────────────────────────────────────────────────────────

function toggleItem(btn, type, id, multi) {
  if (type === 'dress') {
    if (state.dress === id) {
      state.dress = null;
      btn.classList.remove('active');
    } else {
      // Clear old dress
      if (state.dress) {
        const old = document.querySelector(`#dress-grid .item-btn[data-id="${state.dress}"]`);
        if (old) old.classList.remove('active');
        setLayerVisible('dress-' + state.dress, false);
      }
      state.dress = id;
      btn.classList.add('active');
    }
    setLayerVisible('dress-' + id, state.dress === id);
  } else if (type === 'hair') {
    if (state.hair === id) {
      state.hair = null;
      btn.classList.remove('active');
      setLayerVisible('hair-' + id, false);
    } else {
      if (state.hair) {
        const old = document.querySelector(`#hair-grid .item-btn[data-id="${state.hair}"]`);
        if (old) old.classList.remove('active');
        setLayerVisible('hair-' + state.hair, false);
      }
      state.hair = id;
      btn.classList.add('active');
      setLayerVisible('hair-' + id, true);
    }
  } else if (type === 'jewelry') {
    toggleSet(state.jewelry, id, btn, 'jewelry-');
  } else if (type === 'makeup') {
    toggleSet(state.makeup, id, btn, 'makeup-');
  } else if (type === 'shoes') {
    toggleSet(state.shoes, id, btn, 'shoes-', ['heels', 'boots']);
    // Also handle accessories
    if (id === 'kokoshnik' || id === 'dupatta-head') {
      if (state.shoes.has(id)) {
        setLayerVisible('acc-' + id, true);
      } else {
        setLayerVisible('acc-' + id, false);
      }
      return;
    }
  }
}

function toggleSet(set, id, btn, prefix, exclusive = null) {
  if (set.has(id)) {
    set.delete(id);
    btn.classList.remove('active');
    setLayerVisible(prefix + id, false);
  } else {
    if (exclusive) {
      // Only one of the exclusive group
      exclusive.forEach(excId => {
        if (set.has(excId)) {
          set.delete(excId);
          const old = document.querySelector(`[data-id="${excId}"]`);
          if (old) old.classList.remove('active');
          setLayerVisible(prefix + excId, false);
        }
      });
    }
    set.add(id);
    btn.classList.add('active');
    setLayerVisible(prefix + id, true);
  }
}

function setLayerVisible(id, visible) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('visible', visible);
}

// ─── SKIN TONE ────────────────────────────────────────────────────────────────

function applySkin(key) {
  const tone = SKIN_TONES[key];
  const root = document.documentElement;
  // Use CSS custom properties on the SVG's root
  const svg = document.getElementById('barbie-svg');
  svg.style.setProperty('--skin-color', tone.color);
  svg.style.setProperty('--skin-highlight', tone.highlight);
  svg.style.setProperty('--skin-shadow', tone.shadow);
  state.skin = key;

  document.querySelectorAll('.skin-swatch').forEach(s => {
    s.classList.toggle('active', s.dataset.skin === key);
  });
}

// ─── DRESS CATEGORY TABS ──────────────────────────────────────────────────────

document.querySelectorAll('[data-dress-cat]').forEach(btn => {
  btn.addEventListener('click', () => {
    // Hide current dress
    if (state.dress) {
      setLayerVisible('dress-' + state.dress, false);
      state.dress = null;
    }
    state.dressCat = btn.dataset.dressCat;
    document.querySelectorAll('[data-dress-cat]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderDressGrid();
  });
});

// ─── SKIN SWATCHES ───────────────────────────────────────────────────────────

document.querySelectorAll('.skin-swatch').forEach(swatch => {
  swatch.addEventListener('click', () => applySkin(swatch.dataset.skin));
});

// ─── RESET / SAVE ────────────────────────────────────────────────────────────

function resetAll() {
  // Hide all layers
  document.querySelectorAll('.cloth-layer').forEach(el => el.classList.remove('visible'));
  state.dress = null;
  state.hair = null;
  state.jewelry = new Set();
  state.makeup = new Set();
  state.shoes = new Set();
  // Reset buttons
  document.querySelectorAll('.item-btn').forEach(btn => btn.classList.remove('active'));
  applySkin('light');
}

function saveOutfit() {
  const canvas = document.createElement('canvas');
  canvas.width = 320; canvas.height = 500;
  const ctx = canvas.getContext('2d');
  const svg = document.getElementById('barbie-svg');
  const xml = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([xml], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0, 320, 500);
    URL.revokeObjectURL(url);
    const link = document.createElement('a');
    link.download = 'barbie-outfit.png';
    link.href = canvas.toDataURL();
    link.click();
  };
  img.src = url;
}

// ─── INIT ─────────────────────────────────────────────────────────────────────

renderDressGrid();
renderGrid('hair-grid', HAIR_ITEMS, 'hair', false);
renderGrid('jewelry-grid', JEWELRY_ITEMS, 'jewelry', true);
renderGrid('makeup-grid', MAKEUP_ITEMS, 'makeup', true);
renderGrid('shoes-grid', SHOES_ITEMS, 'shoes', true);
applySkin('light');
</script>
